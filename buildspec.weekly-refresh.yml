version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
  pre_build:
    commands:
      - ': "${EB_APPLICATION_NAME:?Set EB_APPLICATION_NAME to the Elastic Beanstalk application name}"'
      - ': "${EB_ENVIRONMENT_NAME:?Set EB_ENVIRONMENT_NAME to the Elastic Beanstalk environment name}"'
      - ': "${EB_ARTIFACT_BUCKET:?Set EB_ARTIFACT_BUCKET to the S3 bucket used for weekly backend bundles}"'
      - export EB_ARTIFACT_PREFIX="${EB_ARTIFACT_PREFIX:-internlens-backend}"
  build:
    commands:
      - python scripts/refresh_job_corpus.py --timeout "${REFRESH_TIMEOUT_SECONDS:-180}" --min-successful-sources 1 --max-failed-sources "${MAX_FAILED_SOURCES:-2}" --report-file outputs/corpus_refresh_report.json
      - python scripts/check_corpus_health.py --min-active-jobs "${MIN_ACTIVE_JOBS:-1}" --output-file outputs/corpus_health.json
      - python -m pytest -q
      - python scripts/package_eb.py --output-file outputs/internlens_eb_backend.zip
  post_build:
    commands:
      - export SHORT_SHA="$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual}" | cut -c1-12)"
      - export VERSION_LABEL="weekly-corpus-$(date -u +%Y%m%d%H%M%S)-${SHORT_SHA}"
      - export S3_KEY="${EB_ARTIFACT_PREFIX}/weekly/${VERSION_LABEL}.zip"
      - test -f outputs/internlens_eb_backend.zip
      - aws s3 cp outputs/internlens_eb_backend.zip "s3://${EB_ARTIFACT_BUCKET}/${S3_KEY}"
      - aws elasticbeanstalk create-application-version --application-name "${EB_APPLICATION_NAME}" --version-label "${VERSION_LABEL}" --source-bundle S3Bucket="${EB_ARTIFACT_BUCKET}",S3Key="${S3_KEY}"
      - aws elasticbeanstalk update-environment --application-name "${EB_APPLICATION_NAME}" --environment-name "${EB_ENVIRONMENT_NAME}" --version-label "${VERSION_LABEL}"
      - aws elasticbeanstalk wait environment-updated --application-name "${EB_APPLICATION_NAME}" --environment-names "${EB_ENVIRONMENT_NAME}"
      - export DEPLOYED_VERSION="$(aws elasticbeanstalk describe-environments --application-name "${EB_APPLICATION_NAME}" --environment-names "${EB_ENVIRONMENT_NAME}" --query 'Environments[0].VersionLabel' --output text)"
      - test "${DEPLOYED_VERSION}" = "${VERSION_LABEL}"

artifacts:
  files:
    - outputs/internlens_eb_backend.zip
    - outputs/corpus_refresh_report.json
    - outputs/corpus_health.json
    - data/processed/jobs/**/*
  discard-paths: no
