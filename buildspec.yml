version: 0.2

phases:
  install:
    commands:
      - python -m pip install --upgrade pip
      - python -m pip install -r requirements.txt
  build:
    commands:
      - python -m pytest -q
      - python scripts/refresh_job_corpus.py --timeout "${REFRESH_TIMEOUT_SECONDS:-180}" --min-successful-sources 1 --max-failed-sources "${MAX_FAILED_SOURCES:-2}" --report-file outputs/corpus_refresh_report.json
      - python scripts/check_corpus_health.py --min-active-jobs "${MIN_ACTIVE_JOBS:-1}" --output-file outputs/corpus_health.json
      - python scripts/package_eb.py

artifacts:
  files:
    - Procfile
    - requirements.txt
    - src/**/*
    - data/processed/jobs/**/*
  discard-paths: no
