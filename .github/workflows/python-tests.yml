name: python-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run test suite
        run: pytest -q

      - name: evaluate curated ranking cases
        run: python scripts/evaluate_ranking.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: set up node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend dependencies
        run: npm ci

      - name: lint frontend
        run: npm run lint

      - name: test frontend interactions
        run: npm test

      - name: build frontend
        run: npm run build
