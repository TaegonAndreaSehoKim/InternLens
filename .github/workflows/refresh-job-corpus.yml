name: refresh-job-corpus

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: check out repository
        uses: actions/checkout@v7

      - name: set up python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: refresh processed job corpus
        id: refresh
        run: >-
          python scripts/refresh_job_corpus.py
          --min-successful-sources 1
          --max-failed-sources 2
          --report-file outputs/corpus_refresh_report.json

      - name: verify refreshed corpus health
        run: python scripts/check_corpus_health.py --min-active-jobs 1 --output-file outputs/corpus_health.json

      - name: upload refreshed corpus artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: refreshed-job-corpus
          path: |
            data/raw
            data/processed/jobs
            outputs/corpus_refresh_report.json
            outputs/corpus_health.json
          if-no-files-found: warn
